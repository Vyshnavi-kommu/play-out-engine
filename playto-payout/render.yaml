# render.yaml — one-click Render deployment
# https://render.com/docs/blueprint-spec

databases:
  - name: playto-db
    databaseName: playto_payout
    user: playto
    plan: free

services:
  # ── Backend API ──────────────────────────────────────────────────────────
  - type: web
    name: playto-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py seed_data
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: playto-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: playto-redis
          type: redis
          property: connectionString

  # ── Celery Worker ─────────────────────────────────────────────────────────
  - type: worker
    name: playto-celery-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config worker --loglevel=info --concurrency=2
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DATABASE_URL
        fromDatabase:
          name: playto-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: playto-redis
          type: redis
          property: connectionString

  # ── Celery Beat ───────────────────────────────────────────────────────────
  - type: worker
    name: playto-celery-beat
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config beat --loglevel=info
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DATABASE_URL
        fromDatabase:
          name: playto-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: playto-redis
          type: redis
          property: connectionString

  # ── Redis ─────────────────────────────────────────────────────────────────
  - type: redis
    name: playto-redis
    plan: free
    maxmemoryPolicy: noeviction
